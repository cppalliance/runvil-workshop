[package]
name = "workshop-plugin-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A dynamic library, which is the file Workshop's Plugin directory holds,
# and an rlib, so the server can depend on this crate and have Cargo
# build the library with every build of Workshop. The library is named
# for the Plugin, so the file is `plugin_web.dll`, `libplugin_web.so`, or
# `libplugin_web.dylib`.
[lib]
name = "plugin_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The web Plugin, linked in with its own export off.
web-plugin.workspace = true
# `export_plugin!`, which exports the Plugin's entry point from this
# library.
runvil-plugin-sdk.workspace = true

[lints]
workspace = true
