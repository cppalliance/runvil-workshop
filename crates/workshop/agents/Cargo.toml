[package]
name = "workshop-agents"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The one crate a Host depends on: the per-run Harness a conversation
# drives, its control, the recorder tee's trait, the events a
# conversation observes, and the round ids its deltas and transcript
# stamp.
runvil.workspace = true
# Conversation ids are 128 bits from the OS CSPRNG: unguessable by
# anything that has not seen the acknowledging frame.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync` for the conversation's broadcasts and state watch; `rt` for the
# blocking pool a conversation parses its agent on.
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The stock tokio timer that the fixture Host of the conversation suite
# sleeps on.
harness-gateway-client.workspace = true
# The discovery suite seeds an agents directory on disk.
tempfile.workspace = true
# `time` for the deadline the conversation suite sets on each wait.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
